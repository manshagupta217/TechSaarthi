<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="loginpg.css">
</head>
<body>
    <div class="container">
        <div class="box1">
            <div class="img3"></div>
        </div>
        <div class="box2">
            <div class="login">
                <h3>LOGIN</h3>
                <p>Login to access your TravelWise account</p>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email">
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password">
            </div>
            <div class="option">
                <label class="remember">
                    <input type="checkbox">
                    Remember Me
                </label>
                <a href="#" class="forgot">Forgot Password?</a>
            </div>
            <div class="login-btn">
                <div class="btn-box">
                    <button class="btn">LOGIN</button>
                </div>
                <div class="sign-up">
                    <p>Don't have an account? <a href="#">Sign Up</a></p>
                </div>
                <div class="login-with">
                    <p> <span>Or login with</span></p>
                </div>
                <div class="google-btn">
                    <button class="btn2">
                        <div class="img4"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
