<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Info</title>
    <link rel="stylesheet" href="clgform.css">
</head>
<body>
    <nav class="navbar">
        <ul class="menu left">
            <li><a href="/about">About Us</a></li>
            <li><a href="/helpline">Helpline</a></li>
            <li><a href="/chatbot">Chatbot</a></li>
        </ul>
        <div class="box1">
            <div class="img1 logo">
            </div>

        <ul class="menu right">
            <li><a href="/notice">Notice</a></li>
            <li><a href="/details">Details</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </nav>
    <div class="container">
        <h3>College Information</h3>
        <div class="form-wrapper">
            <div class="row">
                <div class="field big">
                    <h4>College Name</h4><input></div>
                <div class="field small">
                    <h4>Type</h4><input></div>
                <div class="field small">
                    <h4>State</h4><input></div>
            </div>
            <div class="row">
                <div class="field big">
                    <h4>Department Name</h4><input></div>
                <div class="field small">
                    <h4>JEE Cutoff</h4><input></div>
                <div class="field small">
                    <h4>CUET Cutoff</h4><input></div>
            </div>
            <div class="row">
                <div class="field big">
                    <h4>Location</h4><input></div>
                <div class="field small">
                    <h4>12th Marks</h4><input></div>
                <div class="field small">
                    <h4>Fees</h4><input></div>
            </div>
            <h3 class="hostel-info">Hostel Information</h3>
            <div class="row hostel-section">
                <div class="field big">
                    <h4>Hostel Availability</h4><input></div>

                <button>Search</button>
